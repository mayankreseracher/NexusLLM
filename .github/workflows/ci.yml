name: Multi-Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy fastapi uvicorn pydantic pytest

      # Linux Build
      - name: Build Engine (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build.sh
          ./build.sh

      # macOS Build (Apple Silicon)
      - name: Build Engine (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build.sh
          ./build.sh

      # Windows Build
      - name: Build Engine (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -S .
          cmake --build build --config Release

      # Run C++ Standalone Benchmark
      - name: Run C++ Native Benchmark (POSIX)
        if: runner.os != 'Windows'
        run: |
          LD_LIBRARY_PATH=. DYLD_LIBRARY_PATH=. ./nexus_bench

      # Install Python Package & Run Test Suite
      - name: Install Python Package
        run: |
          pip install -e .

      - name: Run Python Unit Tests
        run: |
          python -m unittest discover -s tests
