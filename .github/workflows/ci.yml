name: Multi-Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy fastapi uvicorn pydantic pytest

      # Linux Build
      - name: Build Engine (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build.sh
          ./build.sh
          cp libnexus_engine.so python/nexus_llm/ 2>/dev/null || true

      # macOS Build (Apple Silicon & Intel)
      - name: Build Engine (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build.sh
          ./build.sh
          cp libnexus_engine.dylib python/nexus_llm/ 2>/dev/null || true

      # Windows Build
      - name: Build Engine (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -S .
          cmake --build build --config Release --verbose
          if (Test-Path "build\Release\nexus_engine.dll") { Copy-Item "build\Release\nexus_engine.dll" . }
          if (Test-Path "build\nexus_engine.dll") { Copy-Item "build\nexus_engine.dll" . }
          if (Test-Path "build\Release\nexus_bench.exe") { Copy-Item "build\Release\nexus_bench.exe" . }
          if (Test-Path "build\nexus_bench.exe") { Copy-Item "build\nexus_bench.exe" . }
          if (Test-Path "nexus_engine.dll") { Copy-Item "nexus_engine.dll" python\nexus_llm\ }

      # Run C++ Standalone Benchmark
      - name: Run C++ Native Benchmark (POSIX)
        if: runner.os != 'Windows'
        run: |
          LD_LIBRARY_PATH=. DYLD_LIBRARY_PATH=. ./nexus_bench

      - name: Run C++ Native Benchmark (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:PATH = "$(Get-Location);$(Get-Location)\build;$(Get-Location)\build\Release;" + $env:PATH
          if (Test-Path ".\nexus_bench.exe") { .\nexus_bench.exe } elseif (Test-Path "build\Release\nexus_bench.exe") { .\build\Release\nexus_bench.exe }

      # Install Python Package & Run Test Suite
      - name: Install Python Package
        run: |
          pip install -e .

      - name: Run Python Unit Tests (POSIX)
        if: runner.os != 'Windows'
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}
          DYLD_LIBRARY_PATH: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}
        run: |
          python -m unittest discover -s tests -v

      - name: Run Python Unit Tests (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: ${{ github.workspace }}\python;${{ github.workspace }}
        run: |
          $env:PATH = "$(Get-Location);$(Get-Location)\build;$(Get-Location)\build\Release;" + $env:PATH
          python -m unittest discover -s tests -v
